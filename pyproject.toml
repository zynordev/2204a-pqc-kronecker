[project]
name = "pqc-kronecker"
version = "0.0.1"
description = "TÜBİTAK 2204-A: ML-KEM ve merkezlenmiş Kronecker ikamesi"
requires-python = ">=3.11"
dependencies = ["cryptography>=38"]

[project.scripts]
pqcdrop = "pqc.pqcdrop:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["experiments/00-on-olcum"]
