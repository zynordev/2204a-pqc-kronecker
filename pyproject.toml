[project]
name = "pqc-kronecker"
version = "1.0.0"
description = "TÜBİTAK 2204-A: ML-KEM ve merkezlenmiş Kronecker ikamesi (PQC-Drop)"
requires-python = ">=3.11"
dependencies = ["cryptography>=38"]

[project.scripts]
pqcdrop = "pqc.pqcdrop:main"
pqcdrop-gui = "pqc.gui:main"
pqcdrop-tui = "pqc.tui:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.5", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["experiments/00-on-olcum"]

# BLE001/S110: src/pqc'deki ağ keşfi, arayüz ve aktarım kodu, bir bağlantı ya da
# arayüz hatasında programı düşürmek yerine bilerek devam eder. Bu davranış
# değiştirilmeden daraltılmadıkça kural uygulanmaz.
# ISC004: docs/ altındaki PDF üretici betikleri, ürün kodu değil.
[tool.ruff.lint.per-file-ignores]
"src/pqc/*" = ["BLE001", "S110"]
"docs/*" = ["ISC004"]
